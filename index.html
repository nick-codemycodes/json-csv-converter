<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local JSON/CSV Converter</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; color: #333; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; margin-right: 10px; }
        button:hover { background: #0056b3; }
        
        </style>
</head>
<body>

<div class="container">
    <h2>Offline JSON &harr; CSV Converter</h2>
    <p>Paste your data or upload a file. Processing happens locally in your browser.</p>
    
    <textarea id="inputData" placeholder="Paste JSON or CSV here..."></textarea>
    
    <div>
        <button onclick="convertToCsv()">Convert JSON &rarr; CSV</button>
        <button onclicktoJson" onclick="convertToJson()">Convert CSV &rarr; JSON</button>
        <button onclick="downloadResult()" style="background: #28a745;">Download Result</button>
    </div>

    <h3>Output:</h3>
    <textarea id="outputData" readonly placeholder="Converted output will appear here..."></textarea>
</div>
